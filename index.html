<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="ЯВЬ — соцсеть и мессенджер">
  <meta name="theme-color" content="#050505">

  <!-- PWA -->
  <base href="/">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ЯВЬ">

  <title>ЯВЬ</title>

  <style>
    html, body { height: 100%; margin: 0; background: #050505; }
    /* заставка, пока грузится приложение */
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #050505; transition: opacity .3s ease; z-index: 9999;
    }
    #boot.gone { opacity: 0; pointer-events: none; }
    #boot .logo {
      font: 800 44px/1 -apple-system, Segoe UI, Roboto, sans-serif;
      color: #fff; letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div id="boot"><div class="logo">ЯВ</div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (b) { b.classList.add('gone'); setTimeout(function(){ b.remove(); }, 400); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
