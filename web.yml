# Авто-сборка и публикация веб-версии ЯВЬ на GitHub Pages.
# Срабатывает при каждом пуше в main → собирает Flutter web → кладёт в отдельный публичный репозиторий (gh-pages).
# Так исходники остаются приватными, а Pages раздаёт только готовый билд.
#
# ЧТО НАСТРОИТЬ ОДИН РАЗ (инструкция — в чате):
#  1. Создать новый ПУБЛИЧНЫЙ репозиторий, напр. ya-vi-web.
#  2. Создать Personal Access Token (classic, scope: repo) и добавить его
#     секретом PAGES_TOKEN в этот (исходный) репозиторий.
#  3. Вписать ниже владельца и имя веб-репозитория (DEST_REPO) и домен (CNAME).

name: Build & deploy web

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  DEST_REPO: dntsstudio-ai/ya-vi-web   # ← поменяй на свой веб-репозиторий
  CUSTOM_DOMAIN: ya-vi.com             # ← твой домен (или оставь пустым)

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Enable web
        run: flutter config --enable-web

      - name: Get packages
        run: flutter pub get

      # На своём домене в корне base-href = "/". Если выложишь на username.github.io/ya-vi-web/,
      # поменяй на "/ya-vi-web/".
      - name: Build web
        run: flutter build web --release --base-href "/"

      - name: Add CNAME and .nojekyll
        run: |
          if [ -n "${CUSTOM_DOMAIN}" ]; then echo "${CUSTOM_DOMAIN}" > build/web/CNAME; fi
          touch build/web/.nojekyll
          # fallback для роутинга: любой неизвестный путь отдаёт index.html
          cp build/web/index.html build/web/404.html

      - name: Deploy to Pages repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_TOKEN }}
          external_repository: ${{ env.DEST_REPO }}
          publish_branch: gh-pages
          publish_dir: ./build/web
          force_orphan: true
